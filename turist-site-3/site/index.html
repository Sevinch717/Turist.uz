<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F5F9;--sf:#fff;--tx:#0F1F3D;--mu:#54627D;--ln:#D5DDE8;--ink:#0F1F3D;--bl:#1F5FBF;--tq:#0E9AA0;--sa:#F4B942;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1426;--sf:#132039;--tx:#EAF0FA;--mu:#9DAECB;--ln:#26385A;--ink:#060D1B;--bl:#6FA0F5;--tq:#3CC6CB}}
:root[data-theme="dark"]{--bg:#0B1426;--sf:#132039;--tx:#EAF0FA;--mu:#9DAECB;--ln:#26385A;--ink:#060D1B;--bl:#6FA0F5;--tq:#3CC6CB}
html{scroll-padding-top:70px;scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.1;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sa);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:12px 5vw;flex-wrap:wrap}
.logo{font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.5px;margin-right:auto}.logo i{font-style:normal;color:var(--sa)}
nav{display:flex;gap:16px}nav a{color:#cfd9ec;text-decoration:none;font-weight:500}nav a:hover{color:#fff}
.lang{display:flex;background:#ffffff1a;border-radius:99px;padding:3px}
.lang button{background:none;border:0;color:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font-weight:600}
.lang button[aria-pressed=true]{background:var(--sa);color:#0F1F3D}
main>section{padding:72px 5vw;max-width:1120px;margin:auto}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:56px}
.hero h1{font-size:clamp(38px,6vw,68px);letter-spacing:-2px;font-weight:800}
.hero p{color:var(--mu);font-size:20px;max-width:34em;margin:18px 0 28px}
.btn{display:inline-block;background:var(--bl);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.alt{background:none;color:var(--tx);border:2px solid var(--ln);margin-left:8px}
.btn.sm{padding:8px 14px;font-size:15px}.btn:disabled{opacity:.5;cursor:default}
.demo{background:var(--ink);color:#fff;border-radius:28px;padding:26px;position:relative}
.demo .cam{aspect-ratio:4/3;border-radius:18px;background:linear-gradient(135deg,#1F5FBF,#0E9AA0);display:grid;place-items:center;font-size:96px}
.demo .cap{margin-top:14px;background:#fff;color:#0F1F3D;border-radius:14px;padding:14px 16px;font:700 24px "Bricolage Grotesque",sans-serif}
.demo small{display:block;color:#9DAECB;margin-top:10px}
h2{font-size:clamp(30px,4vw,44px);letter-spacing:-1px;margin-bottom:8px}.sub{color:var(--mu);margin:0 0 28px;max-width:40em}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
select,input,textarea{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:10px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--sf);border:2px solid var(--ln);border-radius:20px;padding:20px;text-align:left;cursor:pointer;min-height:170px;display:flex;flex-direction:column;gap:8px;width:100%}
.card .ic{font-size:44px;line-height:1}.card b{font:700 21px/1.25 "Bricolage Grotesque",sans-serif}
.card.on{border-color:var(--tq)}.card span{color:var(--mu);font-size:15px}.card em{font-style:normal;color:var(--tq);font-weight:600}
.quiz{margin-top:36px;background:var(--sf);border:2px solid var(--ln);border-radius:24px;padding:26px}
.quiz .q{font:700 28px "Bricolage Grotesque",sans-serif;margin:8px 0 18px}
.opts{display:flex;gap:12px;flex-wrap:wrap}.opts button{font-size:52px;background:var(--bg);border:3px solid var(--ln);border-radius:18px;width:96px;height:96px;cursor:pointer}
.opts button.ok{border-color:#1a9c55;background:#1a9c5533}.opts button.no{border-color:#d33;background:#d3333322}
.panel{background:var(--sf);border:2px solid var(--ln);border-radius:24px;padding:22px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.chat{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--bl);color:#fff}.msg.a{background:var(--bg);border:1px solid var(--ln)}
.msg button{display:block;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chips button{border:2px solid var(--ln);background:none;border-radius:99px;padding:6px 14px;cursor:pointer}
.row{display:flex;gap:10px}.row input{flex:1;min-width:0}
video{width:100%;aspect-ratio:4/3;background:#000;border-radius:18px;object-fit:cover;transform:scaleX(-1)}
.out{font:700 30px/1.25 "Bricolage Grotesque",sans-serif;min-height:80px;margin:12px 0}
.note{color:var(--mu);font-size:14px}
#big{position:fixed;inset:0;z-index:20;background:var(--ink);color:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;padding:6vw;text-align:center}
#big.open{display:flex}#big p{font:800 clamp(32px,8vw,88px)/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 32px;overflow:auto;max-height:70vh}
footer{padding:30px 5vw;color:var(--mu);text-align:center;font-size:14px}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}nav{display:none}main>section{padding:48px 5vw}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">Tur<i>ist</i></div>
  <nav><a href="#learn" data-i="nav1"></a><a href="#tourist" data-i="nav2"></a><a href="#camera" data-i="nav3"></a></nav>
  <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="uz">UZ</button></div>
</header>
<main>
<section class="hero">
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <a class="btn" href="#learn" data-i="c1"></a><a class="btn alt" href="#camera" data-i="c2"></a>
  </div>
  <div class="demo" aria-hidden="true"><div class="cam">🤟</div><div class="cap" data-i="demo"></div><small data-i="demos"></small></div>
</section>

<section id="learn">
  <h2 data-i="l_t"></h2><p class="sub" data-i="l_s"></p>
  <div class="bar"><label for="tgt" data-i="l_i"></label>
    <select id="tgt"><option value="en">English</option><option value="ru">Русский</option><option value="uz">O‘zbekcha</option></select>
    <span class="note" data-i="l_h"></span></div>
  <div class="grid" id="cards"></div>
  <div class="quiz"><b data-i="q_t"></b><div class="q" id="qtext"></div><div class="opts" id="qopts"></div>
    <p class="note" id="qfb" aria-live="polite"></p><button class="btn sm" id="qnext" data-i="q_n"></button></div>
</section>

<section id="tourist">
  <h2 data-i="t_t"></h2><p class="sub" data-i="t_s"></p>
  <div class="bar"><label for="ctry" data-i="t_c"></label><select id="ctry"></select>
    <label><input type="checkbox" id="deaf"> <span data-i="t_d"></span></label></div>
  <div class="two">
    <div class="panel"><div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <div class="row"><input id="ask" data-ip="t_p"><button class="btn" id="send" data-i="t_a"></button></div></div>
    <div class="panel"><h3 data-i="tr_t"></h3><p class="note" data-i="tr_s"></p>
      <textarea id="trin" rows="4" style="width:100%" data-ip="tr_p"></textarea>
      <div class="out" id="trout" style="font-size:24px;min-height:60px" aria-live="polite"></div>
      <button class="btn sm" id="trbtn" data-i="tr_b"></button>
      <button class="btn sm alt" id="trbig" data-i="big"></button>
      <button class="btn sm alt" id="trsay" data-i="say"></button></div>
  </div>
</section>

<section id="camera">
  <h2 data-i="k_t"></h2><p class="sub" data-i="k_s"></p>
  <div class="two">
    <div class="panel"><video id="vid" autoplay playsinline muted></video>
      <div class="bar" style="margin:14px 0 0"><button class="btn sm" id="kstart" data-i="k_on"></button><button class="btn sm" id="kread" disabled data-i="k_r"></button><button class="btn sm alt" id="kstop" data-i="k_off"></button></div></div>
    <div class="panel">
      <div class="bar"><label for="sl" data-i="k_sl"></label><select id="sl"><option>ASL</option><option>BSL</option><option value="Russian Sign Language">RSL</option><option value="Uzbek Sign Language">O‘ZS</option></select></div>
      <div class="bar"><label for="ol" data-i="k_ol"></label><select id="ol"><option value="English">English</option><option value="Russian">Русский</option><option value="Uzbek">O‘zbekcha</option></select></div>
      <div class="out" id="kout" aria-live="polite"></div>
      <button class="btn sm alt" id="kbig" data-i="big"></button><button class="btn sm alt" id="ksay" data-i="say"></button>
      <p class="note" data-i="k_n"></p></div>
  </div>
</section>
</main>
<footer>Turist · <span data-i="foot"></span></footer>
<div id="big" role="dialog" aria-modal="true"><p id="bigt"></p><button class="btn" id="bigx" data-i="close"></button></div>

const VL={en:"en-US",ru:"ru-RU",uz:"uz-UZ"};
async function ask(){const q=$("#ask").value.trim();if(!q)return;$("#ask").value="";addMsg("u",q);
 const s=await ai(),d=addMsg("a",T[L].think);if(!s){d.textContent=T[L].off;return}
 const c=C[$("#ctry").value],deaf=$("#deaf").checked;
 const ins=`You are Turist, a warm, accurate travel guide for ${c[0]}. Reply in ${LN[L]}. Cover local values, daily customs, etiquette and useful phrases (give key phrases in ${c[1]} with a transliteration if the script is not Latin). Use short, plain sentences, no idioms. ${deaf?"The traveller is deaf or mute: never suggest speaking or listening; suggest written, visual, gesture or app-based ways to communicate, and tips for showing a written note.":"Keep it practical for a general traveller."} Max 120 words. Do not invent laws or prices; say if unsure.\n\nQuestion: `;
 const turns=hist.slice(-6).concat([{role:"user",content:ins+q}]);
 try{const r=await s(turns,{modelTier:"quick",cache:false,onText:({text})=>{d.textContent=text;$("#chat").scrollTop=1e9}});
  d.textContent=r.text;hist.push({role:"user",content:q},{role:"assistant",content:r.text});
  const b=document.createElement("button");b.className="btn sm alt";b.textContent=T[L].big;b.onclick=()=>bigShow(r.text);d.append(b)}
 catch(e){d.textContent=e.text||T[L].off}}
$("#send").onclick=ask;$("#ask").onkeydown=e=>{if(e.key==="Enter")ask()};
$("#trbtn").onclick=async()=>{const t=$("#trin").value.trim();if(!t)return;const s=await ai(),o=$("#trout"),c=C[$("#ctry").value];
 if(!s){o.textContent=T[L].off;return}o.textContent=T[L].think;
 try{const r=await s(`Translate into ${c[1]}. Reply with the translation only, then on a new line a Latin-script pronunciation guide if ${c[1]} is not written in Latin script.\n\n${t}`,{modelTier:"quick",onText:({text})=>o.textContent=text});o.textContent=r.text}catch(e){o.textContent=e.text||T[L].off}};
$("#trbig").onclick=()=>bigShow($("#trout").textContent.split("\n")[0]);
$("#trsay").onclick=()=>say($("#trout").textContent.split("\n")[0],C[$("#ctry").value][2]);
/* Camera */
$("#kstart").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}});$("#vid").srcObject=stream;$("#kread").disabled=false}catch(e){$("#kout").textContent=T[L].cerr}};
$("#kstop").onclick=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$("#vid").srcObject=null;$("#kread").disabled=true};
const snap=()=>{const v=$("#vid"),c=document.createElement("canvas");c.width=480;c.height=360;c.getContext("2d").drawImage(v,0,0,480,360);return new Promise(r=>c.toBlob(r,"image/jpeg",.75))};
$("#kread").onclick=async()=>{const s=await ai(),o=$("#kout");if(!s){o.textContent=T[L].off;return}
 let lim=null;try{lim=await s.limits()}catch(e){}if(!lim||!lim.images){o.textContent=T[L].noimg;return}
 $("#kread").disabled=true;o.textContent=T[L].hold;const f=[];for(let i=0;i<4;i++){f.push(await snap());await new Promise(r=>setTimeout(r,450))}
 const sl=$("#sl").value,ol=$("#ol").value;
 try{const r=await s(`These are ${f.length} consecutive webcam frames (in time order) of a person using ${sl}. Work out the sign, fingerspelled letters or short phrase. Reply in ${ol} with ONE simple sentence or word only. If the signing is unclear or no hands are visible, say so briefly in ${ol} and do not guess.`,{images:f,modelTier:"default",cache:false});o.textContent=r.text}
 catch(e){o.textContent=e.text||T[L].off}$("#kread").disabled=!stream};
$("#kbig").onclick=()=>bigShow($("#kout").textContent);
$("#ksay").onclick=()=>say($("#kout").textContent,VL[{English:"en",Russian:"ru",Uzbek:"uz"}[$("#ol").value]]);
setLang(L);
</script>
</body>
</html>
